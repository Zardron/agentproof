name: AgentProof
description: Verify code changes before merge.
author: Zardron Pesquera
branding:
  icon: shield
  color: blue

inputs:
  base:
    description: Base git ref to compare against
    required: false
    default: origin/main
  fail-on:
    description: Minimum severity that blocks the job (low|medium|high|critical|none)
    required: false
    default: high
  config:
    description: Optional path to agentproof config
    required: false
    default: ''
  working-directory:
    description: Repository subdirectory to analyze
    required: false
    default: '.'
  skip-checks:
    description: Skip typecheck/lint/test/build and run rules only
    required: false
    default: 'false'
  version:
    description: Optional agentproof-cli version to install from npm (default reads action package.json)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install AgentProof
      shell: bash
      run: |
        set -euo pipefail
        ACTION_DIR="${{ github.action_path }}"
        VERSION_INPUT="${{ inputs.version }}"
        if [ -n "$VERSION_INPUT" ]; then
          PKG_VERSION="$VERSION_INPUT"
        else
          PKG_VERSION="$(node -p "require('${ACTION_DIR}/package.json').version")"
        fi

        # Prefer published package; fall back to building this action checkout (pre-publish / forks).
        if npm install -g "agentproof-cli@${PKG_VERSION}" >/tmp/agentproof-npm-install.log 2>&1; then
          echo "Installed agentproof-cli@${PKG_VERSION} from npm"
        else
          echo "npm install failed; building from action source"
          cat /tmp/agentproof-npm-install.log || true
          cd "$ACTION_DIR"
          npm install --omit=dev
          npm run build
          npm install -g .
        fi
        agentproof --version

    - name: Resolve config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.config }}" ]; then
          echo "CONFIG_FILE=${{ inputs.config }}" >> "$GITHUB_ENV"
        else
          printf '%s\n' \
            "extends: ci" \
            "fail_on: ${{ inputs.fail-on }}" \
            "require:" \
            "  typecheck: true" \
            "security:" \
            "  secret_detection: true" \
            "  auth_regression: true" \
            > /tmp/agentproof.ci.yaml
          echo "CONFIG_FILE=/tmp/agentproof.ci.yaml" >> "$GITHUB_ENV"
        fi

    - name: Run AgentProof
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SKIP=""
        if [ "${{ inputs.skip-checks }}" = "true" ]; then
          SKIP="--skip-checks"
        fi
        agentproof --base "${{ inputs.base }}" --ci --config "$CONFIG_FILE" $SKIP
